services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: bunnyera
      POSTGRES_USER: bunnyera
      POSTGRES_PASSWORD: bunnyera

  redis:
    image: redis:7

  api:
    build: ./api-server
    depends_on:
      - postgres
      - redis

  worker:
    build: ./worker
    depends_on:
      - redis
